name: Publish SDK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful build run at this exact commit; required for promotion
        type: string
        default: ''
      core_run_id:
        description: Successful exact-source Core qualified-release run
        type: string
        default: '38047286885'
      core_commit:
        description: Exact Core source commit
        type: string
        default: 'aad4bf45ae1c242f4451700ca59b27280010573a'
      runtime_run_id:
        description: Successful final Runtime qualified-release run (required)
        type: string
        default: ''
      runtime_commit:
        description: Exact final Runtime source commit (required)
        type: string
        default: ''
      publish:
        description: Publish already qualified bytes (run on the version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'build>=1' 'setuptools>=77' wheel packaging
      - name: Build or promote immutable candidate bytes
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_ARTIFACT_TOKEN || github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_TAG: ${{ github.ref_name }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import importlib.util, json, os, pathlib, subprocess, tempfile, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          publishing = os.environ['PUBLISH'] == 'true'
          candidate = os.environ['CANDIDATE_RUN']
          if publishing:
              assert os.environ['SOURCE_REF'].startswith('refs/tags/')
              assert os.environ['SOURCE_TAG'] == 'v' + project['version']
              assert candidate, 'Promotion requires a successful exact-source candidate run'
          if candidate:
              assert candidate.isdigit()
              run = json.loads(subprocess.check_output([
                  'gh', 'api', 'repos/${{ github.repository }}/actions/runs/' + candidate]))
              assert run['head_sha'] == os.environ['SOURCE_COMMIT']
              assert run['conclusion'] == 'success' and run['name'] == 'Publish SDK'
              assert run['path'] == '.github/workflows/publish.yml'
              assert run['event'] in ('push', 'workflow_dispatch')
              subprocess.run(['gh', 'run', 'download', candidate, '--name', 'qualified-release',
                              '--dir', 'release/artifacts'], check=True)
              subprocess.run(['python', 'scripts/release_artifacts.py', 'verify', '--directory',
                              'release/artifacts', '--commit', os.environ['SOURCE_COMMIT']], check=True)
              spec = importlib.util.spec_from_file_location('release', 'scripts/release_artifacts.py')
              release = importlib.util.module_from_spec(spec); spec.loader.exec_module(release)
              committed = release.tar_contents(subprocess.check_output([
                  'git', 'archive', '--format=tar', os.environ['SOURCE_COMMIT']]))
              with tempfile.TemporaryDirectory() as temporary:
                  source = pathlib.Path(temporary)
                  for name, content in committed.items():
                      path = source.joinpath(*release.safe_path(name).parts)
                      path.parent.mkdir(parents=True, exist_ok=True); path.write_bytes(content)
                  release.audit_artifacts(source, pathlib.Path('release/artifacts'),
                                          {project['name']: project['version'], 'b3-prosaic-harness-postgres': '0.2.0'},
                                          ('.', 'adapters/postgres'))
          else:
              subprocess.run(['python', 'scripts/release_artifacts.py', 'build', '--ref',
                              os.environ['SOURCE_COMMIT'], '--output', 'release', '--expect',
                              project['name'] + '=' + project['version'], '--expect',
                              'b3-prosaic-harness-postgres=0.2.0', '--project', '.',
                              '--project', 'adapters/postgres'], check=True)
          PY
      - name: Bind verified upstream candidates to the selected Harness bytes
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_ARTIFACT_TOKEN || github.token }}
          CORE_RUN: ${{ inputs.core_run_id || vars.QUALIFIED_CORE_RUN_ID || '38047286885' }}
          CORE_COMMIT: ${{ inputs.core_commit || vars.QUALIFIED_CORE_COMMIT || 'aad4bf45ae1c242f4451700ca59b27280010573a' }}
          RUNTIME_RUN: ${{ inputs.runtime_run_id || vars.QUALIFIED_RUNTIME_RUN_ID }}
          RUNTIME_COMMIT: ${{ inputs.runtime_commit || vars.QUALIFIED_RUNTIME_COMMIT }}
        run: |
          python scripts/release_artifacts.py upstream --directory release/artifacts --wheelhouse release/upstream-wheels --core-run "$CORE_RUN" --core-commit "$CORE_COMMIT" --runtime-run "$RUNTIME_RUN" --runtime-commit "$RUNTIME_COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bytes
          path: release/artifacts/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: curated-upstream
          path: release/upstream-wheels/
          if-no-files-found: error
          retention-days: 90

  linux:
    needs: artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bytes
          path: release/artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: curated-upstream
          path: release/upstream-wheels
      - name: Verify the curated dependency payload
        run: |
          python -m pip install packaging
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/release_artifacts.py')
          release = importlib.util.module_from_spec(spec); spec.loader.exec_module(release)
          release.verify_upstream(Path('release/artifacts'), Path('release/upstream-wheels'))
          PY
      - name: Install Linux CLI sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap meson ninja-build pkg-config libcap-dev gcc
          git clone https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          git -C "$RUNNER_TEMP/bubblewrap" checkout --detach 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          meson setup "$RUNNER_TEMP/bubblewrap/_build" "$RUNNER_TEMP/bubblewrap" --prefix=/usr -Dman=disabled -Dtests=false
          meson compile -C "$RUNNER_TEMP/bubblewrap/_build"
          sudo meson install -C "$RUNNER_TEMP/bubblewrap/_build"
          # Permit only the trusted namespace broker on this disposable runner.
          # Retain host-wide AppArmor restrictions and kernel sandbox controls.
          sudo install -m 0644 .github/ci/bwrap.apparmor /etc/apparmor.d/prosaic-ci-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/prosaic-ci-bwrap
      - name: Require an operational Linux sandbox
        run: |
          python -m pip install release/upstream-wheels/b3_prosaic-0.4.0-py3-none-any.whl release/upstream-wheels/b3_prosaic_runtime-0.8.0-py3-none-any.whl
          python - <<'PY'
          import platform, subprocess, sys, tempfile
          from pathlib import Path
          from types import SimpleNamespace
          from prosaic_runtime import CliSandboxConfig
          from prosaic_runtime.sandbox import require_backend, _linux_command
          print('Sandbox platform:', sys.platform, platform.machine())
          try:
              require_backend(CliSandboxConfig(mode='required'))
          except Exception:
              subprocess.run(['/usr/bin/bwrap', '--version'], check=False)
              with tempfile.TemporaryDirectory() as temporary:
                  root = Path(temporary).resolve()
                  args = _linux_command([sys.executable, '-c', 'pass'], '/',
                      SimpleNamespace(read_roots=(), forbidden_roots=()),
                      SimpleNamespace(runtime_roots=()), root, root)
                  result = subprocess.run(args, capture_output=True, text=True,
                      env={'PATH': '/usr/bin:/bin', 'PYTHONDONTWRITEBYTECODE': '1', 'PYTHONNOUSERSITE': '1'})
                  print('Sandbox probe exit:', result.returncode)
                  print(result.stderr)
              raise
          PY
      - name: Qualify source and the transported wheel
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          LANE: linux-${{ matrix.os }}-${{ matrix.python }}
          PIP_FIND_LINKS: ${{ github.workspace }}/release/upstream-wheels
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install release/upstream-wheels/b3_prosaic-0.4.0-py3-none-any.whl release/upstream-wheels/b3_prosaic_runtime-0.8.0-py3-none-any.whl -e '.[test]'
          .venv/bin/python scripts/release_artifacts.py qualify --directory release/artifacts --commit "$SOURCE_COMMIT" --label "${LANE}-source" --junit "$RUNNER_TEMP/harness-source.xml" -- .venv/bin/python -m pytest -q --junitxml="$RUNNER_TEMP/harness-source.xml"
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install release/upstream-wheels/b3_prosaic-0.4.0-py3-none-any.whl release/upstream-wheels/b3_prosaic_runtime-0.8.0-py3-none-any.whl release/artifacts/b3_prosaic_harness-0.7.0-py3-none-any.whl
          .venv/bin/python scripts/release_artifacts.py qualify --directory release/artifacts --commit "$SOURCE_COMMIT" --label "${LANE}-wheel" -- .wheel-test/bin/python -I scripts/workflow_factory_smoke.py
      - name: Reject skipped or incomplete Harness sandbox coverage
        id: sandbox_report
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
              'test_documented_sandboxed_blueprint_runs_tool_then_requires_human',
              'test_default_off_sandbox_preserves_legacy_runtime_identity',
              'test_changing_sandbox_policy_invalidates_pending_approval',
              'test_harness_cli_sandbox_denies_outside_secret_and_preserves_pause',
              'test_injected_adapter_cannot_downgrade_required_sandbox[off]',
              'test_injected_adapter_cannot_downgrade_required_sandbox[missing_capability]',
              'test_injected_adapter_cannot_downgrade_required_sandbox[after_construction]',
          }
          report = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'harness-source.xml').getroot()
          suites = list(report.iter('testsuite'))
          cases = list(report.iter('testcase'))
          if (not suites or {case.get('name') for case in cases if case.get('name') in expected} != expected
                  or len([case for case in cases if case.get('name') in expected]) != 7
                  or any(int(suite.get(key, '0')) for suite in suites for key in ('skipped', 'failures', 'errors'))
                  or any(case.find(tag) is not None for case in cases if case.get('name') in expected for tag in ('skipped', 'failure', 'error'))):
              raise SystemExit('All seven Harness sandbox cases must pass with no skips, failures or errors')
          print('All seven required Harness sandbox cases passed without skips')
          PY
      - name: Verify minimum supported dependencies on Python 3.11
        if: matrix.python == '3.11'
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/release/upstream-wheels
        run: |
          python -m venv .floor-test
          .floor-test/bin/python -m pip install 'PyYAML==6.0' 'pyuca==1.2' 'markdown-it-py==3.0.0' 'jsonschema==4.23.0' 'referencing==0.28.4' 'psycopg[binary]==3.2.3' 'psycopg-pool==3.2.0' release/upstream-wheels/b3_prosaic-0.4.0-py3-none-any.whl release/upstream-wheels/b3_prosaic_runtime-0.8.0-py3-none-any.whl release/upstream-wheels/b3_prosaic_runtime_postgres-0.2.0-py3-none-any.whl release/artifacts/b3_prosaic_harness-0.7.0-py3-none-any.whl release/artifacts/b3_prosaic_harness_postgres-0.2.0-py3-none-any.whl
          python scripts/release_artifacts.py qualify --directory release/artifacts --commit "$GITHUB_SHA" --label floor-${{ matrix.os }} -- .floor-test/bin/python -I -c "from prosaic_harness_postgres import PostgresRunStore; store = PostgresRunStore('postgresql://invalid.invalid/unused', namespace='floor'); store.close(); import runpy; runpy.run_path('scripts/workflow_factory_smoke.py', run_name='__main__')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualified-linux-${{ matrix.os }}-${{ matrix.python }}
          path: release/artifacts/qualification-*.json
          if-no-files-found: error
          retention-days: 90

  postgres:
    needs: artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        postgres: ['16', '18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-bytes
          path: release/artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: curated-upstream
          path: release/upstream-wheels
      - name: Install transported exact bytes and verify dependency evidence
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/release/upstream-wheels
        run: |
          python -m pip install packaging pytest PyYAML
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/release_artifacts.py')
          release = importlib.util.module_from_spec(spec); spec.loader.exec_module(release)
          release.verify_receipt(Path('release/artifacts'), '${{ github.sha }}')
          release.verify_upstream(Path('release/artifacts'), Path('release/upstream-wheels'))
          PY
          mkdir -p dist adapters/postgres/dist
          cp release/artifacts/b3_prosaic_harness-0.7.0-py3-none-any.whl dist/
          cp release/artifacts/b3_prosaic_harness_postgres-0.2.0-py3-none-any.whl adapters/postgres/dist/
          python -m pip install release/upstream-wheels/b3_prosaic-0.4.0-py3-none-any.whl release/upstream-wheels/b3_prosaic_runtime-0.8.0-py3-none-any.whl dist/b3_prosaic_harness-0.7.0-py3-none-any.whl adapters/postgres/dist/b3_prosaic_harness_postgres-0.2.0-py3-none-any.whl
          prosaic --version
      - name: Required real database source, installed wheel, crash and standby gates
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
          PIP_FIND_LINKS: ${{ github.workspace }}/release/upstream-wheels
          HARNESS_TEST_WHEELHOUSE: ${{ github.workspace }}/release/upstream-wheels
          HARNESS_TEST_RELEASE_DIRECTORY: ${{ github.workspace }}/release/artifacts
          HARNESS_TEST_JUNIT_XML: ${{ runner.temp }}/harness-postgres.xml
        run: |
          fixture_manifest="$(python adapters/postgres/tests/support/local_cluster.py start --engine docker --version "$POSTGRES_VERSION")"
          trap 'python adapters/postgres/tests/support/local_cluster.py stop --manifest "$fixture_manifest"' EXIT
          python scripts/release_artifacts.py qualify --directory release/artifacts --commit "$GITHUB_SHA" --label postgres-${{ matrix.os }}-${{ matrix.postgres }} --junit "$HARNESS_TEST_JUNIT_XML" -- python adapters/postgres/tests/support/local_cluster.py test --manifest "$fixture_manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualified-postgres-${{ matrix.os }}-${{ matrix.postgres }}
          path: release/artifacts/qualification-*.json
          if-no-files-found: error
          retention-days: 90

  gate:
    needs: [linux, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-bytes
          path: release/artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: qualified-*
          merge-multiple: true
          path: release/artifacts
      - name: Require every exact-byte qualification record
        run: |
          python - <<'PY'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location('release', 'scripts/release_artifacts.py')
          release = importlib.util.module_from_spec(spec); spec.loader.exec_module(release)
          from pathlib import Path
          labels = [f'linux-{os_name}-{version}-{kind}'
                    for os_name in ('ubuntu-24.04', 'ubuntu-24.04-arm')
                    for version in ('3.11', '3.12', '3.13') for kind in ('source', 'wheel')]
          labels += [f'postgres-{os_name}-{version}' for os_name in ('ubuntu-24.04', 'ubuntu-24.04-arm') for version in ('16', '18')]
          labels += [f'floor-{os_name}' for os_name in ('ubuntu-24.04', 'ubuntu-24.04-arm')]
          assert Path('release/artifacts/upstream-receipt.json').is_file()
          release.require_qualification(Path('release/artifacts'), os.environ['GITHUB_SHA'], labels)
          for label in labels:
              record = json.loads(Path('release/artifacts', 'qualification-' + label + '.json').read_text())
              expected_machine = 'aarch64' if 'ubuntu-24.04-arm' in label else 'x86_64'
              assert record['platform'] == 'linux' and record['machine'] == expected_machine
              if label.endswith('-source') or label.startswith('postgres-'):
                  counts = record['result_counts']
                  assert counts['tests'] > 0 and all(counts[key] == 0 for key in ('failures', 'errors', 'skipped'))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualified-release
          path: release/artifacts/
          if-no-files-found: error
          retention-days: 90

  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/')
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualified-release
          path: release/artifacts
      - name: Refuse conflicting existing index bytes
        run: python scripts/release_artifacts.py index-check --directory release/artifacts --commit ${{ github.sha }} --allow-missing
      - name: Prepare only distribution files for upload
        run: |
          mkdir upload
          cp release/artifacts/*.whl release/artifacts/*.tar.gz upload/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload/
          skip-existing: true # Safe only with the mandatory pre/post digest checks.
      - name: Verify actual downloaded public bytes
        run: python scripts/release_artifacts.py index-check --directory release/artifacts --commit ${{ github.sha }}

  github-release:
    needs: [gate, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qualified-release
          path: release/artifacts
      - name: Publish the same bytes and evidence without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_artifacts.py verify --directory release/artifacts --commit "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --dir existing
            python scripts/release_artifacts.py verify --directory existing --commit "$GITHUB_SHA"
            cmp existing/release-receipt.json release/artifacts/release-receipt.json
            cmp existing/upstream-receipt.json release/artifacts/upstream-receipt.json
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Qualified package-index release. Exact byte hashes and platform receipts are attached." release/artifacts/*
          fi
