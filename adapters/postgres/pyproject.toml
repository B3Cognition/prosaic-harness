[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-prosaic-harness-postgres"
version = "0.2.0"
description = "Explicit PostgreSQL run storage for Prosaic Harness"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["b3-prosaic-harness>=0.7,<0.8", "psycopg[binary]>=3.2.3,<4", "psycopg-pool>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1", "setuptools>=77", "wheel", "packaging"]

[project.scripts]
prosaic-harness-postgres = "prosaic_harness_postgres.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
