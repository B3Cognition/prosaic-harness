[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prosaic-harness-postgres"
version = "0.1.1"
description = "Explicit PostgreSQL run storage for Prosaic Harness"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["prosaic-harness>=0.6,<0.7", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]

[project.scripts]
prosaic-harness-postgres = "prosaic_harness_postgres.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
