# Experimental routing for the explicitly requested four-model demo.
# The tier names are policy labels, not benchmarked quality rankings.
default_profile: qwen
allowed_tools: [read_file]
limits:
  timeout_s: 180
  max_tool_rounds: 4
routes:
  fast: ornith
  balanced: qwen
  strong: deepseek
  ultra: nemotron
profiles:
  qwen: &endpoint
    base_url: http://10.16.81.27:8080/v1
    api_key_env: TOKENPROXY_KEY
    model: qwen36-35b-a3b
    max_tokens: 4096
    features:
      streaming: true
      stream_options: true
  ornith:
    <<: *endpoint
    model: ornith-1.5-35b
  deepseek:
    <<: *endpoint
    model: deepseek-v4-flash
  nemotron:
    <<: *endpoint
    model: nemotron-3.5-lightning
# Operator guidance: Qwen for agents/tools, Ornith for general chat/code,
# DeepSeek comparison only (slower, four slots), Nemotron only for very large
# contexts (>262,144 tokens). The small demo exercises routes, not those capacities.
