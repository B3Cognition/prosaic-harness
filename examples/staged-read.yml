version: 1
name: Acquire then analyze evidence
source: .prosaic
runtime: runtime.yml
start: evidence
evidence: [evidence/pilot.md]
limits: {max_calls: 2, max_visits: 1, timeout_s: 180}
steps:
  evidence:
    kind: agent
    agent: subagents/evidence-reader.md
    acquisition: subagents/evidence-acquisition.md
    schema: schemas/brief.json
    tools: [read_file]
    require_tools: [read_file]
    require_reads: [evidence/pilot.md]
    validators: [evidence]
    read_roots: [evidence]
    next: done
  done:
    kind: finish
