# Harness 0.4.2+: sandboxed counterpart of cli-tool.yml.
version: 1
name: Sandboxed CLI analysis with verified execution and human approval
source: .prosaic
runtime: cli-tools-sandboxed-runtime.yml
start: analysis
limits: {max_calls: 2, max_visits: 1, timeout_s: 180}
steps:
  analysis:
    kind: agent
    agent: subagents/cli-spec-reviewer.md
    schema: schemas/cli-analysis.json
    tools: [analyze_spec] # This invocation's grant; must also be declared and allowed.
    read_roots: [evidence] # Read-only CLI input; relative to this workflow's directory.
    require_tools: [analyze_spec] # Require observed successful execution, not a model claim.
    max_attempts: 1
    next: approval
  approval:
    kind: pause
    question: Accept this synthetic wording-check report? This is not production approval.
    requires: [analysis]
    choices: {approve: done, reject: rejected}
  done:
    kind: finish
    requires: [analysis]
  rejected:
    kind: finish
    outcome: rejected
