version: 1
name: Brief a supplied request using TokenProxy
source: .prosaic
runtime: tokenproxy.yml
start: brief
limits: {max_calls: 2, max_visits: 1, timeout_s: 180}
steps:
  brief:
    kind: agent
    agent: subagents/briefer.md
    schema: schemas/brief.json
    max_attempts: 2
    next: done
  done:
    kind: finish
