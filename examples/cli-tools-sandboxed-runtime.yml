# DEVELOPMENT ONLY: install the unreleased Runtime explicitly (see README).
# Operator-owned trust and allowlist, independent of Markdown requests.
tool_directories: [.prosaic/tools]
allowed_tools: [analyze_spec]
cli_sandbox:
  mode: required
  runtime_roots: [] # Extra dependencies only, not HOME or /; never host Unix sockets.
default_profile: local
routes: {balanced: local}
limits: {timeout_s: 180, max_tool_rounds: 4}
profiles:
  local:
    # Replace placeholders before live execution; validate is offline.
    base_url: http://localhost:8000/v1
    api_key_env: LOCAL_LLM_API_KEY
    model: your-tool-calling-model
    max_tokens: 2048
    features: {streaming: false}
