version: 1
name: Three-document incident review without native tools
source: .prosaic
runtime: runtime.yml
start: analysis
evidence: [evidence/incident/timeline.md, evidence/incident/metrics.md, evidence/incident/notes.md]
limits: {max_calls: 6, max_visits: 2, timeout_s: 180, max_run_s: 1800}
steps:
  analysis:
    kind: agent
    agent: subagents/incident-analyst.md
    schema: schemas/brief.json
    validators: [evidence]
    optional_inputs: [review]
    next: review
  review:
    kind: agent
    agent: subagents/incident-reviewer.md
    schema: schemas/review.json
    inputs: [analysis]
    next: gate
  gate:
    kind: gate
    from: review
    field: [approved]
    equals: true
    pass: approval
    fail: analysis
  approval:
    kind: pause
    requires: [analysis, review]
    question: Accept this fictional incident brief? No external publication occurs.
    choices: {approve: done, reject: rejected}
  done:
    kind: finish
    requires: [analysis, review]
  rejected:
    kind: finish
    outcome: rejected
