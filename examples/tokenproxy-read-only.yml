version: 1
name: Scoped evidence reading using TokenProxy
source: .prosaic
runtime: tokenproxy.yml
start: evidence
limits: {max_calls: 2, max_visits: 1, timeout_s: 180}
steps:
  evidence:
    kind: agent
    agent: subagents/evidence-reader.md
    schema: schemas/brief.json
    tools: [read_file]
    require_tools: [read_file]
    read_roots: [evidence]
    next: done
  done:
    kind: finish
