[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prosaic-harness"
version = "0.6.0"
description = "Small durable workflows and validation around neutral Prosaic agents"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "B3 Cognition"}]
dependencies = [
  "prosaic-runtime @ git+https://github.com/B3Cognition/prosaic-runtime.git@b13a62eac955b19b13fe2c9dc646a188069f72f2",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]

[project.scripts]
prosaic-harness = "prosaic_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
