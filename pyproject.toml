[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-prosaic-harness"
version = "0.7.0"
description = "Small durable workflows and validation around neutral Prosaic agents"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "B3 Cognition"}]
dependencies = [
  "b3-prosaic-runtime>=0.8,<0.9",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "referencing>=0.28.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1", "setuptools>=77", "wheel", "packaging"]

[project.scripts]
prosaic-harness = "prosaic_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
